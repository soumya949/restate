# PR governance: <type>/<desc> branch names, Conventional Commits PR titles, and
# CODEOWNERS coverage for sensitive paths. Commit subjects are checked too when the
# repo variable ENFORCE_COMMIT_CONVENTION is "true".
name: PR Governance

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Branch name
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          pattern='^(feat|fix|hotfix|chore|docs|refactor|test|ci|build|release)/[a-z0-9._-]+$'
          if [[ ! "${BRANCH_NAME}" =~ ${pattern} ]]; then
            echo "::error::Invalid branch name '${BRANCH_NAME}'. Expected <type>/<short-description>, e.g. feat/vercel-ai-wrapper"
            exit 1
          fi

      - name: PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|chore|docs|refactor|test|build|ci|perf|revert)(\([a-z0-9._/-]+\))?!?: .+$'
          if [[ ! "${PR_TITLE}" =~ ${pattern} ]]; then
            echo "::error::Invalid PR title '${PR_TITLE}'. Use Conventional Commits, e.g. 'feat(python): add governed_parallel'"
            exit 1
          fi

      - name: Commit subjects
        if: github.event_name == 'pull_request' && vars.ENFORCE_COMMIT_CONVENTION == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "${BASE_REF}" --depth=1
          invalid=0
          while IFS= read -r subject; do
            [[ -z "${subject}" || "${subject}" =~ ^Merge\  ]] && continue
            if [[ ! "${subject}" =~ ^(feat|fix|chore|docs|refactor|test|build|ci|perf|revert)(\([a-z0-9._/-]+\))?!?:\ .+ ]]; then
              echo "::error::Invalid commit subject: ${subject}"
              invalid=1
            fi
          done < <(git log --format=%s "origin/${BASE_REF}..HEAD")
          exit "${invalid}"

      - name: CODEOWNERS for sensitive paths
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "${BASE_REF}" --depth=1
          mapfile -t changed < <(git diff --name-only "origin/${BASE_REF}...HEAD")
          [ -f .github/CODEOWNERS ] || { echo "::error::.github/CODEOWNERS is required"; exit 1; }

          needs_check=0
          for f in "${changed[@]}"; do
            case "${f}" in
              .github/workflows/*|.github/CODEOWNERS|SECURITY.md|.gitleaks.toml) needs_check=1 ;;
            esac
          done
          [ "${needs_check}" -eq 0 ] && exit 0

          missing=0
          for pattern in /.github/workflows/ /.github/CODEOWNERS /SECURITY.md /.gitleaks.toml; do
            if ! awk '!/^#/ && NF >= 2 {print $1}' .github/CODEOWNERS | grep -Fxq "${pattern}"; then
              echo "::error::CODEOWNERS has no owner for ${pattern}"
              missing=1
            fi
          done
          exit "${missing}"
