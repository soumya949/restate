[project]
name = "openbox-restate-example-py-langchain"
version = "0.1.0"
description = "Restate + LangChain agent governed by OpenBox"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "hypercorn",
    "restate-sdk[serde]>=1.0.5",
    "pydantic>=2.11.9",
    "langchain-openai",
    "openbox-restate-sdk[langchain,spans]",
]

[tool.uv.sources]
openbox-restate-sdk = { path = "../../python", editable = true }

[tool.uv]
package = false
