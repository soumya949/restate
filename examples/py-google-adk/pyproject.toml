[project]
name = "openbox-restate-example-py-google-adk"
version = "0.1.0"
description = "Restate + Google ADK agent governed by OpenBox"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "hypercorn",
    "restate-sdk[serde]>=1.0.5",
    "pydantic>=2.11.9",
    "google-adk>=1.20.0",
    "litellm",
    "openbox-restate-sdk[adk,spans]",
]

[tool.uv.sources]
openbox-restate-sdk = { path = "../../python", editable = true }

[tool.uv]
package = false
